# Builds the desktop installers for all three platforms and attaches them to a
# GitHub Release.
#
# ⚠️ electron-builder can only produce an artifact for the platform it runs on
# — the Windows .exe genuinely cannot be built on macOS. That is the whole
# reason this matrix exists rather than a single `npm run package`.
#
# Cutting a release:
#   npm version <patch|minor|major> && git push --follow-tags
#
# Signing: macOS builds are ad-hoc signed, so Homebrew users need
# `--no-quarantine` (see README). Add CSC_LINK / CSC_KEY_PASSWORD /
# APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID as repository secrets
# and this workflow signs and notarizes instead — no edit required.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            args: --mac --arm64
          - name: macOS (Intel)
            os: macos-latest
            args: --mac --x64
          - name: Windows
            os: windows-latest
            args: --win --x64
          - name: Linux
            os: ubuntu-latest
            args: --linux --x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # ⚠️ Electron 43 dropped its postinstall hook — the binary is NOT
      # downloaded by `npm ci` any more, and every build below fails without
      # this line.
      - name: Download the Electron binary
        run: node node_modules/electron/install.js

      - run: npm run app:build

      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # Signs and notarizes when the secrets exist; ad-hoc signs when they
          # do not, rather than failing the build.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Only the installers. `release/` also holds the unpacked application and
      # electron-builder's own scratch directories, which nobody downloads.
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ strategy.job-index }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}"
          --repo "${GITHUB_REPOSITORY}"
          --title "${GITHUB_REF_NAME}"
          --generate-notes
          installers/*
